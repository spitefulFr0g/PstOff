name: Linux portable Cargo checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-cargo:
    name: Portable engine, CLI, and format tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy for portable crates
        run: cargo clippy --locked --all-targets -p pstoff-engine -p pstoff-cli -- -D warnings

      # CLI conversion tests require Windows and are gated with cfg(windows).
      # Keep engine/format tests and portable CLI inspect/argument tests on Ubuntu.
      - name: Test engine, format, and portable CLI behavior
        run: cargo test --locked -p pstoff-engine -p pstoff-cli -p pstoff-format
