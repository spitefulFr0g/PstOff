name: Linux engine and CLI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install sandbox and Rust components
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          rustup component add rustfmt clippy
      - name: Fetch pinned dependencies without executing crate code
        env:
          CARGO_HTTP_USER_AGENT: PstOff-research (https://github.com/spitefulFr0g/PstOff)
        run: cargo fetch --locked
      - name: Sandboxed full checks
        run: scripts/check
